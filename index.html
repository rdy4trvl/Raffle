<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<meta name="theme-color" content="#1f4e2c" />
<title>Marin Century 2026 Raffle</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<main class="card">
  <header class="hero">
    <img src="assets/logo.png" alt="Marin Century 2026" class="logo" />
    <h1>Win a Free Entry</h1>
  </header>

  <!-- Entry form -->
  <form id="raffleForm" novalidate>
    <label>
      First name
      <input type="text" name="firstName" autocomplete="given-name" required />
    </label>

    <label>
      Last name
      <input type="text" name="lastName" autocomplete="family-name" required />
    </label>

    <label>
      Email
      <input type="email" name="email" autocomplete="email" inputmode="email" required />
    </label>

    <fieldset class="radio-group">
      <legend>Have you ridden the Marin Century before?</legend>
      <div class="radio-row">
        <label class="radio">
          <input type="radio" name="ridden" value="yes" required /> Yes
        </label>
        <label class="radio">
          <input type="radio" name="ridden" value="no" required /> No
        </label>
      </div>
    </fieldset>

    <button type="submit" id="submitBtn">Enter the raffle</button>
    <p id="errorMsg" class="error" role="alert" aria-live="polite"></p>
  </form>

  <!-- Sending state -->
  <div id="sending" class="status hidden">
    <div class="spinner" aria-hidden="true"></div>
    <p>Entering you in the raffle…</p>
  </div>

  <!-- Success state -->
  <div id="success" class="status hidden">
    <div class="checkmark" aria-hidden="true">✓</div>
    <h2>You're entered!</h2>
    <p>Check your email for confirmation and your discount code.</p>
  </div>
</main>

<script src="app.js"></script>
</body>
</html>
